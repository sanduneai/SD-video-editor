<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Studio AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f5f0;color:#352b29;font-family:Arial,sans-serif}header{background:#47382f;color:white;text-align:center;padding:28px 15px}header h1{margin:0;font-size:27px}header p{font-size:13px;color:#e9d9cc}main{max-width:540px;margin:24px auto;padding:20px}.panel{background:white;padding:22px;border-radius:16px;box-shadow:0 3px 15px #0000000d}label{display:block;margin:20px 0 8px;font-weight:bold}input,select,button{width:100%;padding:13px;border-radius:9px;font-size:15px}input,select{border:1px solid #d6ccc4}button{background:#47382f;color:white;border:0;margin-top:22px;font-weight:bold}video{width:100%;max-height:400px;margin-top:15px;background:#222;border-radius:10px}.note{font-size:12px;color:#766c66;line-height:1.5}#status{margin-top:15px;font-size:14px}
</style></head>
<body><header><h1>Reel Studio AI</h1><p>Your personal Instagram Reel creator</p></header>
<main><div class="panel"><h2>Create a Product Reel</h2>
<label for="videos">1. Upload raw product videos</label><input id="videos" type="file" accept="video/*" multiple><p class="note">Choose short videos from your iPad.</p>
<label for="style">2. Choose Reel style</label><select id="style"><option>Aesthetic Product Showcase</option><option>Trendy Product Reel</option><option>Product Storytelling</option><option>Promotional Reel</option></select>
<label for="duration">3. Choose duration</label><select id="duration"><option value="15">15 seconds</option><option value="20" selected>20 seconds</option><option value="30">30 seconds</option></select>
<button id="create">Preview My Videos</button><p id="status" role="status"></p><video id="preview" controls playsinline hidden></video><p class="note">Version 1: Upload and preview only. Automatic editing and exporting will be added next.</p></div></main>
<script>
const input=document.getElementById('videos');const button=document.getElementById('create');const video=document.getElementById('preview');const status=document.getElementById('status');let url=null;
button.onclick=()=>{const files=input.files;if(!files.length){status.textContent='Please select a video first.';return;}if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(files[0]);video.src=url;video.hidden=false;status.textContent=files.length+' video(s) selected. Previewing the first clip.';};
</script></body></html>
